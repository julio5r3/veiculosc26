<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificação</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
    }

    .card{
      width:350px;
      padding:40px;
      border-radius:20px;
      background:rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      margin-bottom:15px;
    }

    .desc{
      color:#cbd5e1;
      margin-bottom:30px;
      line-height:1.5;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:12px;
      background:#3b82f6;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#2563eb;
      transform:scale(1.03);
    }

    .loading{
      margin-top:20px;
      display:none;
      color:#93c5fd;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">Verificação</div>

    <div class="desc">
      Clique no botão abaixo para continuar.
    </div>

    <button onclick="verificar()">
      Continuar verificação
    </button>

    <div class="loading" id="loading">
      Verificando...
    </div>
  </div>

  <script>
    function verificar() {
      const loading = document.getElementById("loading");

      loading.style.display = "block";

      setTimeout(() => {
        // ALTERE AQUI O LINK DE REDIRECIONAMENTO
        window.location.href = "https://google.com";
      }, 2000);
    }
  </script>

</body>
</html>
